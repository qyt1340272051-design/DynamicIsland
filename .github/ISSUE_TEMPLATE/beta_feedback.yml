name: Beta 验收反馈
description: 提交真实 Mac 上的 Beta 通过、失败或阻塞结果
title: "[Beta] "
labels:
  - beta
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        感谢参与 Dynamic Island 真机验收。请先从菜单栏选择“复制调试信息”，再将报告粘贴到下方。
  - type: input
    id: beta_version
    attributes:
      label: Beta 版本
      description: 请填写 DMG 文件或 About 中显示的版本。
      placeholder: v0.4.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: matrix_scenario
    attributes:
      label: 设备矩阵场景
      description: 根据 docs/BETA_TESTING.md 选择最接近的场景。
      options:
        - DI-B01 - 刘海 MacBook，单内建屏，默认缩放
        - DI-B02 - 刘海 MacBook，非默认缩放，菜单栏自动隐藏
        - DI-B03 - 刘海 MacBook 加外接屏，内建屏为主屏
        - DI-B04 - 刘海 MacBook 加外接屏，外接屏为主屏
        - DI-B05 - 刘海 MacBook 合盖，仅外接屏
        - DI-B06 - 无刘海 Apple silicon Mac，单内建屏
        - DI-B07 - Apple silicon 桌面 Mac，单外接屏
        - DI-B08 - 无刘海 Mac，双屏混合缩放
        - DI-B09 - Intel Mac 兼容性
        - 不在当前矩阵中
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 验收结果
      options:
        - 通过
        - 失败
        - 阻塞，未能完成
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 主要模块
      options:
        - 屏幕定位与面板
        - 音乐
        - 系统音量
        - 文件托盘与 AirDrop
        - 秒表、番茄钟与倒计时
        - 安装、启动与权限
        - 全部正常
        - 其他
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 结果摘要
      description: 通过时请说明完成了哪些检查；失败时请说明最重要的现象。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤或阻塞原因
      description: 失败或阻塞时请按顺序列出操作；通过时可填“无”。
      placeholder: |
        1. 启动 Dynamic Island
        2. 切换到外接主屏
        3. ……
    validations:
      required: true
  - type: textarea
    id: diagnostic_report
    attributes:
      label: 调试信息
      description: 粘贴菜单栏“复制调试信息”生成的完整文本。
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或其他证据
      description: 屏幕定位问题请尽量包含完整顶边。可拖入附件，请先隐藏私人信息。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查调试信息和附件，其中不包含私人文件、密钥或其他敏感信息。
          required: true
        - label: 我已搜索现有 Issue，未发现相同反馈。
          required: true
