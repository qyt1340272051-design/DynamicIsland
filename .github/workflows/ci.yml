name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/dynamic-island-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI_DERIVED_DATA_PATH: /tmp/dynamic-island-derived-data
      CI_RESULT_BUNDLE_PATH: /tmp/DynamicIslandTests.xcresult
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Test and build
        run: ./Scripts/ci.sh

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandTests-${{ github.run_id }}
          path: ${{ env.CI_RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore
          retention-days: 7
