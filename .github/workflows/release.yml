name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI_DERIVED_DATA_PATH: /tmp/dynamic-island-release-verification
      CI_RESULT_BUNDLE_PATH: /tmp/DynamicIslandReleaseTests.xcresult
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test and build
        run: ./Scripts/ci.sh

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandReleaseTests-${{ github.run_id }}
          path: ${{ env.CI_RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Build and publish unnotarized test DMG
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build unnotarized test DMG
        run: RELEASE_TAG="$GITHUB_REF_NAME" ./Scripts/release.sh --local

      - name: Verify test artifact and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="build/release/Dynamic-Island-${version}-local.json"
          [[ "$(plutil -extract notarized raw "$manifest")" == "false" ]]
          (
            cd build/release
            shasum -a 256 -c "Dynamic-Island-${version}-local.dmg.sha256"
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-${{ github.ref_name }}
          path: |
            build/release/*.dmg
            build/release/*.sha256
            build/release/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="build/release/Dynamic-Island-${version}-local.dmg"
          checksum="$dmg.sha256"
          manifest="build/release/Dynamic-Island-${version}-local.json"
          release_flags=(--verify-tag --title "Dynamic Island $GITHUB_REF_NAME (未公证测试版)" --prerelease)

          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            release_flags+=(--notes-file "$notes_file")
          else
            release_flags+=(--generate-notes)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; refusing to replace public artifacts"
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" "$checksum" "$manifest" "${release_flags[@]}"
          fi
